# ============================================================================
# BOS Playbook - nginx configuration
#
# nginx is the only service in the stack that is reachable from the LAN.
# It serves the application over HTTPS and forwards the API paths to Kong.
#
# The certificate is expected at:
#
#     docker/nginx/certs/fullchain.pem   the certificate
#     docker/nginx/certs/privkey.pem     the private key
#
# Run ./scripts/make-certificates.sh to produce them. The script issues the
# certificate from an internal certificate authority when one is available,
# and falls back to a self-signed certificate when it is not.
#
# Only the standard library of the nginx image is used. There is no
# external module, no CDN and no remote font or icon service: everything
# the browser loads comes from this host.
# ============================================================================

# Lets a WebSocket connection be told to upgrade, and leaves normal
# requests alone. Realtime needs this.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The size of the request body nginx will accept. Increased to 100MB
# to allow concurrent batch uploads, diagnostic logs, and high-res attachments.
client_max_body_size 100m;

# Allow large headers and cookies (needed for Supabase session cookies
# and Next.js SSR Set-Cookie headers)
large_client_header_buffers 4 32k;
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;


# ---------------------------------------------------------------------------
# Gzip
#
# The application sends JSON, HTML, CSS and JavaScript. Images and
# attachments are already compressed and are left alone.
# ---------------------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/woff
    font/woff2;

# ---------------------------------------------------------------------------
# Request logging
#
# The log is written to the container's standard output, where the docker
# log rotation applies. The format records the time spent, so a slow search
# can be spotted without extra tooling.
# ---------------------------------------------------------------------------
log_format bos '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                'rt=$request_time uct=$upstream_connect_time '
                'uht=$upstream_header_time urt=$upstream_response_time';
access_log /var/log/nginx/access.log bos;
error_log  /var/log/nginx/error.log warn;

# ---------------------------------------------------------------------------
# HTTP: everything is redirected to HTTPS.
#
# A playbook is a document that gets read while something is broken, and
# it is read on a shared machine. Plain HTTP would put the session in the
# clear, so it is redirected rather than served.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # The health check stays on plain HTTP so that a monitoring agent on
    # the host does not need the certificate.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Accept requests from the configured domain, server IP, or local host


    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:BOS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # -------------------------------------------------------------------------
    # Security headers
    #
    # The content security policy allows only this host. The application
    # bundles its own fonts and icons, so no external origin is needed.
    # 'unsafe-inline' is allowed for styles because React sets inline
    # styles for the chart and the flow chart geometry, and for scripts
    # because Next.js injects the bootstrap script for the router.
    # -------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    server_tokens off;

    # -------------------------------------------------------------------------
    # The application
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A search over a large corpus can take a moment, and the editor
        # autosaves in the background, so the timeouts are generous.
        proxy_connect_timeout 30s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;

        # Next.js streams the page. Buffering would delay the first byte
        # for no benefit.
        proxy_buffering off;
    }

    # -------------------------------------------------------------------------
    # The API
    #
    # The four prefixes are the ones Kong routes. Everything else is the
    # application.
    # -------------------------------------------------------------------------
    location ~ ^/(rest|auth|realtime|storage)/v1 {
        proxy_pass http://kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    # -------------------------------------------------------------------------
    # The health check
    # -------------------------------------------------------------------------
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy';
    }

    # -------------------------------------------------------------------------
    # Static assets
    #
    # The files Next.js builds are content addressed, so they can be
    # cached for a year. The logo and the other public files are not, so
    # they get a shorter life.
    # -------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|webp|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # -------------------------------------------------------------------------
    # Request logging
    #
    # The log is written to the container's standard output, where the
    # docker log rotation applies. The format records the time spent, so
    # a slow search can be spotted without extra tooling.
    # -------------------------------------------------------------------------
}
