# ============================================================================
# BOS Playbook - Kong configuration
#
# Kong is the single door into the Supabase services. Nothing else in the
# stack publishes a port to the LAN, so this file decides what the browser
# is allowed to reach.
#
# The configuration is declarative on purpose: it lives in version control
# next to the application, so what runs on the server can be read and
# reviewed. It is loaded at start-up by KONG_DECLARATIVE_CONFIG.
#
# The routes follow the Supabase URL layout, so the browser talks to
#
#     https://playbook.<domain>/rest/v1/...
#     https://playbook.<domain>/auth/v1/...
#     https://playbook.<domain>/realtime/v1/...
#     https://playbook.<domain>/storage/v1/...
#
# and the Supabase client needs no special configuration beyond that base
# URL. The frontend and the API are served from the same host by nginx, so
# these are same-origin requests.
#
# ---------------------------------------------------------------------------
# Kong does NOT authenticate the caller
# ---------------------------------------------------------------------------
# There is no key-auth plugin here, on purpose.
#
# Kong is a router in this stack. The services behind it are the ones that
# decide who the caller is:
#
#   * PostgREST verifies the signature of the bearer token against
#     PGRST_JWT_SECRET and then switches to the role inside the token
#     (anon, authenticated, service_role). What that role may read is
#     decided by the row level policies in the database.
#   * GoTrue verifies its own session tokens and refresh tokens.
#   * The storage service signs and checks its own URLs and checks the
#     caller's token before it issues one.
#
# A key-auth plugin in Kong would be a second, parallel authentication
# system with its own store of keys. The keys in it would have to be kept
# in step with the ones the services use, and the two would eventually
# disagree - which is a lockout bug, not a security gain. It would also
# mean the browser's key was checked by a component that cannot apply the
# row level policies, so the check would say "yes" to callers the
# database must refuse.
#
# What Kong does do is limit the blast radius: only the four paths below
# exist, the bodies are size limited, and the traffic is rate limited.
# ============================================================================
_format_version: "3.0"
_transform: true

services:
  # -------------------------------------------------------------------------
  # PostgREST - the database API
  # -------------------------------------------------------------------------
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1
        methods:
          - GET
          - POST
          - PATCH
          - DELETE
          - PUT
          - OPTIONS
    plugins:
      # The browser is on the same host as the application, so the API is
      # same-origin. The CORS plugin is still needed for the preflight
      # request the browser sends before a PATCH or a DELETE, and for
      # anyone who runs the studio from another address.
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PATCH
            - DELETE
            - PUT
            - OPTIONS
          headers:
            - Authorization
            - apikey
            - Content-Type
            - Prefer
            - Range
            - X-Client-Info
            - X-Client-IP
            - X-Forwarded-For
          exposed_headers:
            - Content-Range
            - X-Supabase-Api-Version
          credentials: false
          max_age: 3600
      # A single page of the application makes about ten calls: one to
      # check the session, four to work out the person's roles, three for
      # the shared navigation data, and the rest for the page itself. A
      # hundred agents reading the playbook on a busy afternoon make a few
      # thousand calls a minute between them, and those calls arrive from
      # the application container, so they share one counter.
      #
      # The limit is therefore set well above what a busy shift produces.
      # Its purpose is to stop a runaway script, not to meter a person
      # reading the playbook.
      #
      # The counter is kept per client address (limit_by: ip), and the
      # address is the real one - see KONG_TRUSTED_IPS in the compose file,
      # which lets Kong read the client address from the X-Forwarded-For
      # header that nginx sets. Without that, every request in the
      # building would share the single address of the proxy, and one
      # person's runaway script would lock everybody out.
      - name: rate-limiting
        config:
          minute: 12000
          limit_by: ip
          policy: local
          hide_client_headers: false

  # -------------------------------------------------------------------------
  # GoTrue - authentication
  # -------------------------------------------------------------------------
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1
        methods:
          - GET
          - POST
          - PATCH
          - DELETE
          - PUT
          - OPTIONS
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PATCH
            - DELETE
            - PUT
            - OPTIONS
          headers:
            - Authorization
            - apikey
            - Content-Type
            - X-Client-Info
            - X-Client-IP
            - X-Forwarded-For
          exposed_headers:
            - X-Supabase-Api-Version
          credentials: false
          max_age: 3600
      # The sign-in endpoint is counted on its own.
      #
      # With limit_by: path, a request is only counted against the path
      # named here; every other request on this route falls back to being
      # counted per client address. So the sign-in attempts share one
      # counter, and the rest of the authentication traffic - checking
      # the session, refreshing it, signing out - is counted per person
      # and is never affected by how many people are signing in.
      #
      # This is where a password is checked, so it is the endpoint worth
      # protecting against a script that tries passwords in a loop. The
      # limit is generous enough for a whole company to sign in at once,
      # or for every session to refresh at the same moment after a
      # restart, and still too tight for a steady stream of attempts.
      - name: rate-limiting
        config:
          minute: 600
          limit_by: path
          path: /auth/v1/token
          policy: local
          error_message: Too many sign-in attempts. Wait a moment and try again.

  # -------------------------------------------------------------------------
  # Realtime - live updates
  #
  # The route keeps its path, because the realtime client connects to
  # /realtime/v1/websocket and expects the path to survive. WebSocket
  # upgrades are handled by Kong itself.
  # -------------------------------------------------------------------------
  - name: realtime-v1
    url: http://realtime:4000/
    routes:
      - name: realtime-v1-route
        strip_path: false
        paths:
          - /realtime/v1
        methods:
          - GET
          - POST
          - OPTIONS
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - OPTIONS
          headers:
            - Authorization
            - apikey
            - Content-Type
            - X-Client-Info
            - X-Client-IP
            - X-Forwarded-For
          credentials: false
          max_age: 3600

  # -------------------------------------------------------------------------
  # Storage - attachments and images
  # -------------------------------------------------------------------------
  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-route
        strip_path: true
        paths:
          - /storage/v1
        methods:
          - GET
          - POST
          - PATCH
          - DELETE
          - PUT
          - OPTIONS
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PATCH
            - DELETE
            - PUT
            - OPTIONS
          headers:
            - Authorization
            - apikey
            - Content-Type
            - Prefer
            - Range
            - X-Client-Info
            - X-Client-IP
            - X-Forwarded-For
          exposed_headers:
            - Content-Range
          credentials: false
          max_age: 3600
      # The storage service enforces its own file size limit as well; this
      # one stops a large body being read into memory before that check.
      - name: request-size-limiting
        config:
          allowed_payload_size: 104857600

  # -------------------------------------------------------------------------
  # Studio - the database administration interface
  #
  # Studio is not published to the LAN. It is bound to 127.0.0.1 in the
  # compose file and reached through a tunnel by an administrator, so no
  # route is needed here.
  # -------------------------------------------------------------------------
